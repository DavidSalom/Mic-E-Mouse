<!--
    Collect mouse events on the page and print to console.
-->

<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Mouse events</title>
    <script>
        // Keep track of the time between events, in milliseconds.
        var lastTick = Date.now();
        var refreshRate = 1;
        var runningAverage = 1;
        function printEvent(event) {
            var now = Date.now();
            refreshRate = now - lastTick;
            if (refreshRate == 0) {
                refreshRate = 1;
            }
            refreshRate = 1000 / refreshRate;
            lastTick = now;
            runningAverage = (runningAverage + refreshRate) / 2;
            runningAverage = Math.round(runningAverage * 1000) / 1000;
            document.body.innerHTML = 'Refresh rate: ' + runningAverage + ' Hz';
        }
        document.addEventListener('mousemove', printEvent);
    </script>
  </head>
  <body>
    <p>Click or move the mouse over the page.</p>
  </body>
</html>
